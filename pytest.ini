[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Coverage gate set to 85 % for the initial scaffold. Ratchet upward as
# you add tests — the remaining gaps are mostly defensive fall-through
# branches that need careful mocking to exercise. See
# `pytest tests/ --cov-report=term-missing` for the per-file picture.
addopts = --cov --cov-fail-under=85
