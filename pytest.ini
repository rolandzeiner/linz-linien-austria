[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Hard cap so a hung async fixture surfaces as a failure, not as a CI
# job that idles for 6 hours waiting for the runner to time it out.
# Comfortable here: the whole suite runs in ~2s now that conftest's
# _collapse_domain_cooldown_sleep fixture stops tests paying the real
# 15s domain cooldown (it used to be 62s, 60s of it sleeping).
timeout = 60
# Coverage gate set to 90 % — Platinum baseline. Tightening below this
# means the integration grew defensive branches without tests; raise the
# floor instead of the ceiling. See
# `pytest tests/ --cov-report=term-missing` for the per-file picture.
addopts = --cov --cov-fail-under=90
# Turn DeprecationWarning into a test failure. This is the portfolio's
# early-warning system for HA API removals: without it, a deprecated call
# is only discovered when it stops working, which is a user-facing break
# rather than a red CI run. The three ignores scope it to OUR code —
# upstream's own deprecation churn is not actionable here.
filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:homeassistant.*
    ignore::DeprecationWarning:pytest_homeassistant_custom_component.*
    ignore::DeprecationWarning:aiohttp.*
